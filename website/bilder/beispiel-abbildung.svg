<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" role="img" aria-label="Abstrakte Grafik aus Flächen in Rot, Petrol und Sisal">
	<!-- Beispielbild für das Live-Beispiel der Figure. Kantige Flächen in Ides-Farben wie die Grafiken der Übersichtsseiten. -->
	<rect width="640" height="360" fill="rgb(243, 241, 236)"/><!-- Sisal 94 -->
	<rect x="0" y="0" width="224" height="360" fill="rgb(53, 68, 79)"/><!-- Petrol 26 -->
	<rect x="256" y="40" width="344" height="96" fill="rgb(207, 0, 61)"/><!-- Red 41 -->
	<rect x="256" y="168" width="104" height="152" fill="rgb(82, 105, 122)"/><!-- Petrol 40 -->
	<rect x="392" y="168" width="104" height="152" fill="rgb(188, 201, 210)"/><!-- Petrol 78 -->
	<rect x="528" y="168" width="72" height="152" fill="rgb(216, 208, 192)"/><!-- Sisal 80 -->
	<rect x="40" y="248" width="144" height="72" fill="rgb(224, 230, 235)"/><!-- Petrol 90 -->
</svg>
