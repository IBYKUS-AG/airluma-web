# Baut die Website bei jeder Änderung auf main mit Eleventy und Pagefind (npm run bauen)
# und veröffentlicht _site/ auf GitHub Pages. Schlägt der Bau fehl, bleibt die bisherige Fassung online.
# Das Storybook (website/storybook/) liegt fertig im Repository und wird hier nicht neu gebaut.
name: Website veröffentlichen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Immer nur eine Veröffentlichung zur Zeit; eine laufende wird nicht abgebrochen.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  bauen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run bauen
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  veroeffentlichen:
    needs: bauen
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
